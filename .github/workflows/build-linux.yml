name: Build native Linux app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  powershell_syntax:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Validate bridge PowerShell syntax (without Microsoft Access)
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("bridge/Export-LinAccessBridge.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake qt6-base-dev libqt6sql6-sqlite mdbtools xz-utils unzip
      - name: Restore private regression fixtures
        run: ./scripts/restore-fixtures.sh
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            "-DLINACCESS_REAL_MDB_FILE=$PWD/fixtures/raw/Keksrezepte.mdb" \
            "-DLINACCESS_COMPLEX_MDB_FILE=$PWD/fixtures/raw/Kassa_CSE_V2.0.mdb" \
            "-DLINACCESS_REAL_BRIDGE_DIR=$PWD/fixtures/unpacked/Keksrezepte-Bridge" \
            "-DLINACCESS_COMPLEX_BRIDGE_DIR=$PWD/fixtures/unpacked/Kassa_CSE_V2.0-Bridge-2003-Retry"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run tests
        run: |
          ./scripts/restore-fixtures.sh
          ctest --test-dir build --output-on-failure
      - name: Package DEB
        run: cpack --config build/CPackConfig.cmake -G DEB
      - name: Upload native executable and DEB
        uses: actions/upload-artifact@v4
        with:
          name: linaccess-ubuntu-24-04
          path: |
            build/linaccess
            linaccess-*.deb
          if-no-files-found: error
  debian:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - image: debian:bookworm
            label: debian-12
          - image: debian:trixie
            label: debian-13
    container: ${{ matrix.image }}
    steps:
      - name: Bootstrap Debian build environment
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git ca-certificates \
            build-essential cmake qt6-base-dev libqt6sql6-sqlite mdbtools dpkg-dev xz-utils unzip
      - uses: actions/checkout@v4
      - name: Restore private regression fixtures
        run: ./scripts/restore-fixtures.sh
      - name: Configure native Qt application
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            "-DLINACCESS_REAL_MDB_FILE=$PWD/fixtures/raw/Keksrezepte.mdb" \
            "-DLINACCESS_COMPLEX_MDB_FILE=$PWD/fixtures/raw/Kassa_CSE_V2.0.mdb" \
            "-DLINACCESS_REAL_BRIDGE_DIR=$PWD/fixtures/unpacked/Keksrezepte-Bridge" \
            "-DLINACCESS_COMPLEX_BRIDGE_DIR=$PWD/fixtures/unpacked/Kassa_CSE_V2.0-Bridge-2003-Retry"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run portable tests
        run: |
          ./scripts/restore-fixtures.sh
          ctest --test-dir build --output-on-failure
      - name: Build native Debian package
        run: cpack --config build/CPackConfig.cmake -G DEB
      - name: Upload Debian binary and package
        uses: actions/upload-artifact@v4
        with:
          name: linaccess-${{ matrix.label }}
          path: |
            build/linaccess
            linaccess-*.deb
          if-no-files-found: error
